name: Publish to MCP Registry

# Registers the version in package.json with the MCP Registry. release.yml
# calls this after publishing to npm, and it can be run by hand from the
# Actions tab when a release's registration failed (2.1.2 did, because the
# registry checked npm before the new version was visible there).
#
# It authenticates with the job's GitHub OIDC token, which carries the
# io.github.coo-quack namespace. Publishing from a maintainer's machine goes
# through `mcp-publisher login github` instead, which only granted
# io.github.<user>/* when tried, so there is no local fallback.

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate server.json
        run: |
          REPO_URL=$(node -p "require('./package.json').repository.url.replace(/^git\+/, '').replace(/\.git$/, '')")
          VERSION=$(node -p "require('./package.json').version")
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          PKG_NAME=$(node -p "require('./package.json').name")
          DESCRIPTION=$(node -p "require('./package.json').description")
          jq -n \
            --arg schema "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json" \
            --arg name "$MCP_NAME" \
            --arg description "$DESCRIPTION" \
            --arg repoUrl "$REPO_URL" \
            --arg version "$VERSION" \
            --arg pkgName "$PKG_NAME" \
            '{
              "$schema": $schema,
              "name": $name,
              "description": $description,
              "repository": {"url": $repoUrl, "source": "github"},
              "version": $version,
              "packages": [{"registryType": "npm", "identifier": $pkgName, "version": $version, "transport": {"type": "stdio"}}]
            }' > server.json
          {
            echo "VERSION=$VERSION"
            echo "MCP_NAME=$MCP_NAME"
            echo "PKG_NAME=$PKG_NAME"
          } >> "$GITHUB_ENV"

      # A manual run for a version that is already registered should be a
      # no-op rather than a failure.
      - name: Check whether the version is already registered
        id: registered
        run: |
          set -uo pipefail
          got=$(curl -fsS --get "https://registry.modelcontextprotocol.io/v0/servers" \
            --data-urlencode "search=$MCP_NAME" --data-urlencode "limit=100" \
            | jq -r --arg n "$MCP_NAME" --arg v "$VERSION" \
              '[.servers[]? | select(.server.name == $n and .server.version == $v)] | length')
          if [ "${got:-0}" != "0" ]; then
            echo "$MCP_NAME $VERSION is already registered, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The registry validates the package against npm, and a version npm has
      # just accepted can take a few minutes to be served (2.1.2 took about
      # four). Waiting here is what keeps the registration from failing.
      - name: Wait until npm serves the version
        if: steps.registered.outputs.skip != 'true'
        run: |
          set -uo pipefail
          for attempt in $(seq 1 30); do
            if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
              echo "npm serves $PKG_NAME@$VERSION"
              exit 0
            fi
            echo "not on npm yet (attempt $attempt), waiting"
            sleep 20
          done
          echo "::error::$PKG_NAME@$VERSION is not on npm after 10 minutes."
          exit 1

      - name: Install mcp-publisher
        if: steps.registered.outputs.skip != 'true'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login to MCP Registry
        if: steps.registered.outputs.skip != 'true'
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registered.outputs.skip != 'true'
        run: mcp-publisher publish server.json
